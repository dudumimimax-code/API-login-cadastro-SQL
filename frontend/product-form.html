<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto | Gestão de Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="dashboard.html" class="brand">Gestão de Produtos</a>
      <a href="dashboard.html" class="btn btn-outline btn-sm">← Voltar</a>
    </div>
  </header>

  <main class="container">
    <section class="card form-card">
      <h1 id="form-title">Novo produto</h1>
      <p class="subtitle" id="form-subtitle">Preencha os dados do produto.</p>

      <div id="alert" class="alert" role="alert"></div>

      <form id="product-form" novalidate>
        <div class="form-group">
          <label for="name">Nome do produto</label>
          <input type="text" id="name" name="name" maxlength="120" placeholder="Ex.: Notebook" required>
          <div class="field-error" data-error-for="name"></div>
        </div>

        <div class="form-group">
          <label for="category">Categoria</label>
          <input type="text" id="category" name="category" maxlength="80" placeholder="Ex.: Eletrônicos" list="category-suggestions" required>
          <datalist id="category-suggestions">
            <option value="Eletrônicos">
            <option value="Informática">
            <option value="Móveis">
            <option value="Vestuário">
            <option value="Alimentos">
            <option value="Livros">
          </datalist>
          <div class="field-error" data-error-for="category"></div>
        </div>

        <div class="form-actions">
          <a href="dashboard.html" class="btn btn-outline">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/product-form.js"></script>
</body>
</html>
