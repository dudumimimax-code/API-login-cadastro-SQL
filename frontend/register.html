<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Gestão de Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="card">
    <h1>Criar conta</h1>
    <p class="subtitle">Cadastre-se para começar a registrar seus produtos.</p>

    <div id="alert" class="alert" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="name">Nome completo</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="Seu nome" required>
        <div class="field-error" data-error-for="name"></div>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@email.com" required>
        <div class="field-error" data-error-for="email"></div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" required>
        <div class="field-error" data-error-for="password"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
    </form>

    <p class="footer-link">Já tem conta? <a href="index.html">Entrar</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>initRegisterPage();</script>
</body>
</html>
